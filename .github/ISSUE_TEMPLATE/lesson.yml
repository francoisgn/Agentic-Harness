name: Leçon
description: Proposer une leçon au tableau LESSONS.md du cadre (erreur à ne pas refaire, valable au-delà d'un projet)
title: "Leçon : "
labels: [leçon, docs]
body:
  - type: markdown
    attributes:
      value: |
        Skill `/lesson-propose`. Vérifier d'abord qu'elle n'est pas déjà dans `docs/LESSONS.md` (sinon : c'est
        l'auto-relecture qui l'a manquée, le dire ici). Le numéro `L..` est attribué par la PR qui l'intègre.
  - type: dropdown
    id: portee
    attributes:
      label: Portée
      options: [général, docs, ci, linux-cloud, swift, ios, sécurité, conformité]
    validations:
      required: true
  - type: textarea
    id: lecon
    attributes:
      label: Leçon
      description: Une phrase impérative et vérifiable en revue (ce qu'il faut faire), pas l'anecdote.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: "Projet, PR, commentaire ou commit, à un SHA nommé. Rien de deviné."
    validations:
      required: true
  - type: textarea
    id: contre-exemple
    attributes:
      label: Contre-exemple et vérification
      description: Ce qui s'est passé, et comment un relecteur (ou un test, un linter) vérifie la leçon.
