name: Lesson
description: Propose a lesson for the harness LESSONS.md table (a mistake not to repeat, valid beyond one project)
title: "Lesson: "
labels: [lesson, "type: docs", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Skill `/lesson-propose`. First check that it is not already in `docs/LESSONS.md` (if it is, the self-review
        missed it: say so here). The `L..` number is assigned by the PR that integrates it.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [general, docs, ci, linux-cloud, swift, ios, security, compliance]
    validations:
      required: true
  - type: textarea
    id: lesson
    attributes:
      label: Lesson
      description: One imperative sentence that a review can verify (what to do), not the anecdote.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: "Project, PR, comment or commit, at a named SHA. Nothing guessed."
    validations:
      required: true
  - type: textarea
    id: counter-example
    attributes:
      label: Counter-example and verification
      description: What happened, and how a reviewer (or a test, a linter) verifies the lesson.
