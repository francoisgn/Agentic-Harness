name: Revue IA (réutilisable)

# Le « service de revue » du cadre, équivalent maison de CodeRabbit (REVIEW-SERVICE.md) : un relecteur Claude, en
# lecture seule sur le code, qui poste UN commentaire de revue par passage sur la tête de la PR, au format du cadre (constats
# Haute / Moyenne / Basse / Détail, fichier:ligne, scénario d'échec, correctif ; LESSONS.md ; règles du projet).
# Économie (CI-BUDGET.md, REVIEW-ROUNDS.md) :
#   - rien sur un brouillon ; l'appelant le déclenche sur `ready_for_review` et `synchronize` d'une PR prête ;
#   - un nouveau push annule la revue en cours (concurrency) ; tours bornés (`max-turns`) ;
#   - label `revue: aucune` sur la PR → sautée (PR triviale, Dependabot).
# Sortie limitée à un commentaire (`gh pr comment`, jamais `gh pr review`) : le relecteur ne peut pas émettre d'approbation
# GitHub, même si un texte de la PR tente de l'y pousser (injection de prompt) ; le verdict reste du texte.
# Sécurité : `pull_request` (jamais `pull_request_target`) : une PR de fork n'a pas le secret, le job est sauté. Ce
# contrôle n'est donc JAMAIS requis dans le ruleset ; la revue adversariale de la session reste la garantie.
on:
  workflow_call:
    inputs:
      model:
        description: Modèle relecteur (niveau ≥ celui de l'issue, ORCHESTRATION.md §2), ex. claude-opus-5-5
        type: string
        default: "claude-sonnet-5-5"
      max-turns:
        type: number
        default: 30
      prompt-file:
        description: Consignes du projet ajoutées au prompt du cadre (chemin dans le dépôt ; absent = ignoré)
        type: string
        default: ".harness/review-instructions.md"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  review:
    name: Revue IA
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && !contains(github.event.pull_request.labels.*.name, 'revue: aucune')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Consignes
        env:
          PROMPT_FILE: ${{ inputs.prompt-file }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo "Tu es le service de revue du cadre agentic-harness sur la PR #$PR, tête $HEAD_SHA, base $BASE_REF."
            echo "Lecture seule sur le code : ni commit, ni push, ni merge. Tu postes UN commentaire de PR (gh pr comment), rien d'autre."
            echo "Lis : CLAUDE.md, .harness/docs/ESSENTIEL.md, .harness/docs/LESSONS.md, la spec liée (Closes/Refs)."
            echo "Revue incrémentale : si tu as déjà commenté cette PR (gh pr view $PR --json comments), relis"
            echo "seulement git diff <sha de ta dernière revue>...HEAD, et vérifie si tes constats précédents sont traités."
            echo "Sinon, relis git diff origin/$BASE_REF...HEAD. Pour chaque risque réel : scénario d'échec concret, fichier:ligne,"
            echo "correctif proportionné. Sévérités : Haute / Moyenne / Basse / Détail. Pas de constat de style qu'un"
            echo "linter attrape ; pas de constat sans chemin d'exécution ; regrouper les cas d'une même classe."
            echo "Vérifie aussi : tests qui échoueraient sans le changement (LESSONS L01), secrets en dur, données"
            echo "personnelles, docs à jour dans le même commit (L09), sources citées pour tout fait externe (L21)."
            echo "Faille de sécurité exploitable : seulement « CHANGEMENTS DEMANDÉS — constat de sécurité, détail"
            echo "transmis en privé », sans détail public."
            echo "Format : **Revue IA (<modèle>) : APPROUVÉ | CHANGEMENTS DEMANDÉS** — tête <sha>, constats numérotés,"
            echo "liste Vérifié ; moins de 400 mots ; en français ; terminer par le pied du cadre :"
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
            if [ -f "$PROMPT_FILE" ]; then echo; echo "Consignes du projet :"; cat "$PROMPT_FILE"; fi
          } >"$RUNNER_TEMP/prompt.md"

      - id: prompt
        name: Lire les consignes
        run: |
          {
            echo "text<<HARNESS_EOF"
            cat "$RUNNER_TEMP/prompt.md"
            echo "HARNESS_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Revue
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
