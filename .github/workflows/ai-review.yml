name: AI review (reusable)

# The harness "review service", the in-house equivalent of CodeRabbit (REVIEW-SERVICE.md): a Claude reviewer, read-only
# on the code, that posts ONE review comment per run on the PR head, in the harness format (findings
# High / Medium / Low / Detail, file:line, failure scenario, fix; LESSONS.md; project rules).
# Economy (CI-BUDGET.md, REVIEW-ROUNDS.md):
#   - nothing on a draft; the caller triggers it on `ready_for_review` and `synchronize` of a ready PR;
#   - a new push cancels the review in progress (concurrency); bounded turns (`max-turns`);
#   - label `review: skip` on the PR → skipped (trivial PR, Dependabot). Project-local label (.github/labels.local.json).
# Output limited to a comment (`gh pr comment`, never `gh pr review`): the reviewer cannot issue a GitHub approval,
# even if some text in the PR tries to push it to (prompt injection); the verdict stays text.
# Security: `pull_request` (never `pull_request_target`): a fork PR does not have the secret, the job is skipped. So
# this check is NEVER required in the ruleset; the session's adversarial review remains the guarantee.
on:
  workflow_call:
    inputs:
      model:
        description: Reviewer model (tier ≥ the one of the issue, ORCHESTRATION.md §2), e.g. claude-opus-5-5
        type: string
        default: "claude-sonnet-5-5"
      max-turns:
        type: number
        default: 30
      prompt-file:
        description: Project instructions appended to the harness prompt (path in the repository; missing = ignored)
        type: string
        default: ".harness/review-instructions.md"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  review:
    name: AI review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && !contains(github.event.pull_request.labels.*.name, 'review: skip')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instructions
        env:
          PROMPT_FILE: ${{ inputs.prompt-file }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo "You are the review service of the Belayline harness on PR #$PR, head $HEAD_SHA, base $BASE_REF."
            echo "Read-only on the code: no commit, no push, no merge. You post ONE PR comment (gh pr comment), nothing else."
            echo "Read: CLAUDE.md, .harness/docs/ESSENTIALS.md, .harness/docs/LESSONS.md, the linked spec (Closes/Refs)."
            echo "Incremental review: if you already commented on this PR (gh pr view $PR --json comments), review"
            echo "only git diff <sha of your last review>...HEAD, and check whether your previous findings are handled."
            echo "Otherwise, review git diff origin/$BASE_REF...HEAD. For each real risk: concrete failure scenario, file:line,"
            echo "proportionate fix. Severities: High / Medium / Low / Detail. No style finding that a"
            echo "linter catches; no finding without an execution path; group the cases of one class."
            echo "Also check: tests that would fail without the change (LESSONS L01), hard-coded secrets, personal"
            echo "data, docs updated in the same commit (L09), sources cited for every external fact (L21)."
            echo "Exploitable security flaw: only \"CHANGES REQUESTED: security finding, details sent"
            echo "privately\", with no public detail."
            echo "Format: **AI review (<model>): APPROVED | CHANGES REQUESTED**, head <sha>, numbered findings,"
            echo "Verified list; under 400 words; in the project's language (.harness/config.json › language, default"
            echo "English); end with the harness footer:"
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
            if [ -f "$PROMPT_FILE" ]; then echo; echo "Project instructions:"; cat "$PROMPT_FILE"; fi
          } >"$RUNNER_TEMP/prompt.md"

      - id: prompt
        name: Read the instructions
        run: |
          {
            echo "text<<HARNESS_EOF"
            cat "$RUNNER_TEMP/prompt.md"
            echo "HARNESS_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
