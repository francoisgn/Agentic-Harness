name: CI

# CI of the harness itself, in ONE Linux job (budget: CI-BUDGET.md §2, §5): harness consistency (skills, agents,
# manifest, labels, naming), tests (harness-sync.sh, hooks, flow-metrics, checks), scripts, workflows, JSON and
# versions, markdown (tables, anchors, relative links), secrets. Each step runs even if the previous one fails: one run gives every finding.
# Nothing on a draft; a docs PR costs only one minute.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Scripts, workflows, tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks reads the PR history

      - name: Harness consistency (skills, agents, manifest, labels, naming)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-framework.py

      - name: Python tests (flow-metrics, checks)
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Diagrams up to date with their sources (docs/diagrams)
        if: ${{ !cancelled() }}
        run: python3 scripts/diagrams/render.py --check && python3 scripts/diagrams/render.py --check --dir templates/docs/diagrams

      - name: Harness README meets the standard it asks for (README-STANDARD.md)
        if: ${{ !cancelled() }}
        run: python3 scripts/readme-check.py

      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: shellcheck scripts/*.sh scripts/tests/*.sh plugins/harness/scripts/*.sh templates/scripts/*.sh

      - name: Python (hook syntax)
        if: ${{ !cancelled() }}
        run: python3 -m py_compile plugins/harness/scripts/guard-git.py scripts/*.py scripts/diagrams/*.py

      - name: Valid JSON and consistent versions
        if: ${{ !cancelled() }}
        run: |
          for f in $(git ls-files '*.json'); do jq empty "$f" || exit 1; done
          V=$(cat VERSION); P=$(jq -r .version plugins/harness/.claude-plugin/plugin.json)
          [ "$V" = "$P" ] || { echo "::error::VERSION ($V) ≠ plugin.json ($P)"; exit 1; }
          grep -q "^## $V " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $V"; exit 1; }

      - name: Tests of harness-sync.sh and the hooks
        if: ${{ !cancelled() }}
        run: scripts/tests/test-harness-sync.sh

      - name: Workflows · actionlint
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

      - name: Workflows · zizmor
        if: ${{ !cancelled() }}
        # The templates reference the harness by tag; harness-sync.sh pins them by SHA in the consumer project (tested).
        run: pipx run zizmor==1.31.1 --offline --min-severity low .github/workflows

      - name: Markdown (tables, anchors)
        if: ${{ !cancelled() }}
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Markdown · relative links and cross-file anchors
        if: ${{ !cancelled() }}
        run: python3 scripts/doc-links.py

      - name: Secrets · gitleaks
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then LOG_OPTS="$BASE_SHA..HEAD"; else LOG_OPTS=--all; fi
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$LOG_OPTS" --redact --no-banner --exit-code 1
