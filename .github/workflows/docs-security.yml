name: Docs and security (reusable)

# Free baseline, no third-party account (CI-BUDGET.md §Security), in ONE job: markdownlint (tables and anchors), README
# at the harness standard, relative links and cross-file anchors in Markdown,
# gitleaks (history), zizmor and actionlint (workflows). Each tool runs even if the previous one fails: a
# single run gives every finding. Nothing runs on a draft.
# Disable what the project already covers elsewhere (inputs), so as not to pay twice.
on:
  workflow_call:
    inputs:
      markdownlint:
        type: boolean
        default: true
      gitleaks:
        type: boolean
        default: true
      zizmor:
        type: boolean
        default: true
      actionlint:
        type: boolean
        default: true
      readme:
        description: Project README at the harness standard (README-STANDARD.md) and diagrams up to date; skipped if the scripts are not vendored
        type: boolean
        default: true
      doc-links:
        description: Relative links and cross-file anchors of the Markdown files resolve (doc-links.py); skipped if the script is not vendored
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: Docs · gitleaks · workflows
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks reads the whole history

      - name: Markdown · tables and anchors (markdownlint, rules from .markdownlint-cli2.jsonc)
        if: ${{ !cancelled() && inputs.markdownlint }}
        run: npx --yes markdownlint-cli2@0.18.1

      - name: README · harness standard and diagrams up to date (.harness/config.json › readme)
        if: ${{ !cancelled() && inputs.readme }}
        run: |
          if [ ! -f .harness/scripts/readme-check.py ]; then echo "::notice::readme-check.py not vendored: check skipped"; exit 0; fi
          rc=0
          python3 .harness/scripts/readme-check.py || rc=1
          if [ -d docs/diagrams ] && [ -f .harness/scripts/diagrams-render.py ]; then
            python3 .harness/scripts/diagrams-render.py --check || rc=1
          fi
          exit "$rc"

      - name: Markdown · relative links and cross-file anchors (in-file anchors are markdownlint's MD051)
        if: ${{ !cancelled() && inputs.doc-links }}
        run: |
          if [ ! -f .harness/scripts/doc-links.py ]; then echo "::notice::doc-links.py not vendored: check skipped"; exit 0; fi
          python3 .harness/scripts/doc-links.py

      - name: Secrets · gitleaks (history)
        if: ${{ !cancelled() && inputs.gitleaks }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then LOG_OPTS=HEAD; else LOG_OPTS=--all; fi
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$LOG_OPTS" --redact --no-banner --exit-code 1

      - name: Workflows · zizmor
        if: ${{ !cancelled() && inputs.zizmor }}
        run: pipx run zizmor==1.31.1 --offline --min-severity low .github/workflows

      - name: Workflows · actionlint (+ shellcheck of run:)
        if: ${{ !cancelled() && inputs.actionlint }}
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
