name: Flow dashboard (reusable)

# Publishes the project state for everyone (non-technical people included) in ONE pinnable issue, updated in place:
# progress per milestone, bottlenecks (`status: blocked`, `status: needs-decision`), stalled work, CI or review loops,
# agent / human ratio, first-run quality (problem PRs, correction effort), CI cost (FINOPS.md §4, STEWARDS.md §4).
# Vendored script: .harness/scripts/flow-metrics.py.
# Cost: one Linux job of under a minute per run; call it on `schedule` (daily) and by hand.
# The `dashboard` label is not in the harness base set: this workflow creates it if it is missing.
on:
  workflow_call:
    inputs:
      issue-title:
        type: string
        default: "Project dashboard"
      label:
        type: string
        default: "dashboard"
      script:
        type: string
        default: ".harness/scripts/flow-metrics.py"
      stall-hours:
        type: number
        default: 24
      max-ci-runs:
        type: number
        default: 6
      max-review-rounds:
        type: number
        default: 3
      max-problem-ratio:
        description: "% of problem PRs (finding in review) above which the dashboard turns 🟠"
        type: number
        default: 50
      fail-on-red:
        description: Fail the job if the dashboard is 🔴 (alert through the workflow failure e-mail)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ inputs.script }}
          STALL: ${{ inputs.stall-hours }}
          MAX_CI: ${{ inputs.max-ci-runs }}
          MAX_REV: ${{ inputs.max-review-rounds }}
          MAX_PB: ${{ inputs.max-problem-ratio }}
        run: |
          python3 "$SCRIPT" --repo "$GITHUB_REPOSITORY" --json-out report.json --stall-hours "$STALL" \
            --max-ci-runs "$MAX_CI" --max-review-rounds "$MAX_REV" --max-problem-ratio "$MAX_PB" >report.md
          printf '\n---\n_Generated by the "%s" workflow (Belayline)._\n' "$GITHUB_WORKFLOW" >>report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Publish to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.issue-title }}
          LABEL: ${{ inputs.label }}
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Issue kept up to date by the dashboard workflow" 2>/dev/null || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$N" ]; then
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body-file report.md
          fi

      - name: Alert if 🔴
        if: ${{ inputs.fail-on-red }}
        run: |
          [ "$(jq -r .status report.json)" != "🔴" ] || { echo "::error::Dashboard 🔴: see the issue"; exit 1; }
