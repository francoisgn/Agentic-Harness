name: Tableau de bord du flux (réutilisable)

# Publie l'état du projet pour tous (non-techniciens compris) dans UNE issue épinglable, mise à jour en place :
# avancement par jalon, goulots (`bloqué`, `à clarifier`), travaux en panne, boucles de CI ou de revue, ratio
# agents / humains, coût CI (FINOPS.md §4, STEWARDS.md §4). Script vendorisé : .harness/scripts/flow-metrics.py.
# Coût : un job Linux de moins d'une minute par passage ; l'appeler sur `schedule` (quotidien) et à la main.
on:
  workflow_call:
    inputs:
      issue-title:
        type: string
        default: "Tableau de bord du projet"
      label:
        type: string
        default: "tableau de bord"
      script:
        type: string
        default: ".harness/scripts/flow-metrics.py"
      stall-hours:
        type: number
        default: 24
      max-ci-runs:
        type: number
        default: 6
      max-review-rounds:
        type: number
        default: 3
      fail-on-red:
        description: Faire échouer le job si le tableau est 🔴 (alerte par e-mail d'échec de workflow)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    name: Tableau de bord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calculer
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ inputs.script }}
          STALL: ${{ inputs.stall-hours }}
          MAX_CI: ${{ inputs.max-ci-runs }}
          MAX_REV: ${{ inputs.max-review-rounds }}
        run: |
          python3 "$SCRIPT" --repo "$GITHUB_REPOSITORY" --json-out report.json --stall-hours "$STALL" \
            --max-ci-runs "$MAX_CI" --max-review-rounds "$MAX_REV" >report.md
          printf '\n---\n_Généré par le workflow « %s » (agentic-harness)._\n' "$GITHUB_WORKFLOW" >>report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Publier dans l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.issue-title }}
          LABEL: ${{ inputs.label }}
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Issue mise à jour par le workflow du tableau de bord" 2>/dev/null || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$N" ]; then
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body-file report.md
          fi

      - name: Alerte si 🔴
        if: ${{ inputs.fail-on-red }}
        run: |
          [ "$(jq -r .status report.json)" != "🔴" ] || { echo "::error::Tableau de bord 🔴 : voir l'issue"; exit 1; }
