name: Hygiène des issues (réutilisable)

# Vérifie qu'une issue porte un label par axe obligatoire (METHODOLOGY.md §Labels) et le dit dans UN commentaire,
# mis à jour puis supprimé quand tout est en ordre (jamais de pile de rappels). Une issue parapluie (`feedback`) ne
# demande que la priorité. À la fermeture, retire les labels d'axe `statut` (une issue fermée n'en porte aucun).
# Appel sur `issues` (opened, edited, labeled, unlabeled, reopened, closed) ; sur `schedule` ou `workflow_dispatch`,
# balaie les issues ouvertes et écrit un bilan dans le résumé du job, sans commenter.
# Les événements `issues` lancent la copie du workflow appelant présente sur la branche PAR DÉFAUT du dépôt.
on:
  workflow_call:
    inputs:
      labels-file:
        type: string
        default: .harness/labels.json
      local-labels-file:
        type: string
        default: .github/labels.local.json
      required-axes:
        description: Axes obligatoires, séparés par des virgules (noms du champ `axis` des fichiers de labels)
        type: string
        default: type,priorité,modèle,taille
      umbrella-label:
        type: string
        default: feedback
      umbrella-axes:
        type: string
        default: priorité
      exempt-labels:
        description: Labels qui dispensent de tout contrôle, séparés par des virgules
        type: string
        default: dependencies
      require-summary:
        description: Exiger une section « ### Résumé » (ou « ### Summary ») en tête de description
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Labels et résumé
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABELS_FILE: ${{ inputs.labels-file }}
          LOCAL_LABELS_FILE: ${{ inputs.local-labels-file }}
          REQUIRED_AXES: ${{ inputs.required-axes }}
          UMBRELLA_LABEL: ${{ inputs.umbrella-label }}
          UMBRELLA_AXES: ${{ inputs.umbrella-axes }}
          EXEMPT_LABELS: ${{ inputs.exempt-labels }}
          REQUIRE_SUMMARY: ${{ inputs.require-summary }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- harness:issue-hygiene -->';
            const FOOTER = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const list = (s) => (s || '').split(',').map((x) => x.trim()).filter(Boolean);
            const read = (p) => (fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : []);
            const axisOf = new Map();
            for (const l of [...read(process.env.LABELS_FILE), ...read(process.env.LOCAL_LABELS_FILE)]) {
              if (l.axis) axisOf.set(l.name, l.axis);
            }
            const examples = (axis) => [...axisOf].filter(([, a]) => a === axis).map(([n]) => '`' + n + '`').join(', ');
            const { owner, repo } = context.repo;

            function problems(issue) {
              const names = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
              if (names.some((n) => list(process.env.EXEMPT_LABELS).includes(n))) return [];
              const umbrella = names.includes(process.env.UMBRELLA_LABEL);
              const axes = list(umbrella ? process.env.UMBRELLA_AXES : process.env.REQUIRED_AXES);
              const out = [];
              for (const axis of axes) {
                const found = names.filter((n) => axisOf.get(n) === axis);
                if (found.length === 0) out.push(`axe **${axis}** sans label (${examples(axis)})`);
                else if (found.length > 1 && axis !== 'type') out.push(`axe **${axis}** avec plusieurs labels (${found.join(', ')})`);
              }
              if (process.env.REQUIRE_SUMMARY === 'true' && !umbrella &&
                  !/^###[ \t]*(Résumé|Summary)[ \t]*\r?\n\s*[^#\s]/im.test(issue.body || '')) {
                out.push('description sans section `### Résumé` en tête (user story ou synthèse en deux lignes)');
              }
              return out;
            }

            if (context.eventName !== 'issues') {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              const rows = [];
              for (const issue of issues.filter((i) => !i.pull_request)) {
                const p = problems(issue);
                if (p.length) rows.push(`| #${issue.number} | ${p.join(' ; ').replace(/\|/g, '\\|')} |`);
              }
              await core.summary.addRaw(rows.length
                ? `### ${rows.length} issue(s) à compléter\n\n| Issue | Manque |\n|---|---|\n${rows.join('\n')}\n`
                : '### 🟢 Toutes les issues ouvertes ont leurs labels\n').write();
              return;
            }

            const issue = context.payload.issue;
            const ref = { owner, repo, issue_number: issue.number };
            if (context.payload.action === 'closed') {
              for (const l of issue.labels) {
                if (axisOf.get(l.name) === 'statut') {
                  await github.rest.issues.removeLabel({ ...ref, name: l.name }).catch(() => {});
                  core.info(`retiré à la fermeture : ${l.name}`);
                }
              }
              return;
            }
            const p = problems(issue);
            const comments = await github.paginate(github.rest.issues.listComments, { ...ref, per_page: 100 });
            const mine = comments.find((c) => (c.body || '').includes(MARKER));
            if (!p.length) {
              if (mine) await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
              return;
            }
            const body = `${MARKER}\nÀ compléter avant de prendre l'issue (cadre agentic-harness, METHODOLOGY.md) :\n\n` +
              p.map((x) => `- ${x}`).join('\n') + FOOTER;
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...ref, body });
            }
