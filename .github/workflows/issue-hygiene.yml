name: Issue hygiene (reusable)

# Checks the labels of an issue (METHODOLOGY.md §Labels) and says what is wrong in ONE comment, updated then deleted
# once everything is in order (never a pile of reminders):
#   - an open issue carries exactly one `status:` label and exactly one `type:` label;
#   - once triaged (no `status: needs-triage`), exactly one `priority:` and one `difficulty:` label;
#   - an umbrella issue (`type: epic`) does not need a difficulty.
# A newly opened or reopened issue without a status gets `status: needs-triage`. On close, every `status:` label is
# removed (a closed issue carries none).
# The axis of a label is its `axis` field in the label files, or else its `axis: ` name prefix.
# Call on `issues` (opened, edited, labeled, unlabeled, reopened, closed); on `schedule` or `workflow_dispatch`,
# sweeps the open issues and writes a report in the job summary, without commenting.
# `issues` events run the copy of the calling workflow present on the repository's DEFAULT branch.
on:
  workflow_call:
    inputs:
      labels-file:
        type: string
        default: .harness/labels.json
      local-labels-file:
        type: string
        default: .github/labels.local.json
      required-axes:
        description: Axes that need exactly one label on every open issue, comma-separated (`axis` field of the label files)
        type: string
        default: "status,type"
      triage-axes:
        description: Axes that need exactly one label once the issue is triaged, comma-separated
        type: string
        default: "priority,difficulty"
      triage-label:
        description: Status set on a new issue that has none; while an issue carries it, `triage-axes` are not required
        type: string
        default: "status: needs-triage"
      umbrella-label:
        type: string
        default: "type: epic"
      umbrella-axes:
        description: Axes checked on an umbrella issue instead of `required-axes` + `triage-axes`
        type: string
        default: "status,type,priority"
      exempt-labels:
        description: Labels that exempt an issue from every check, comma-separated
        type: string
        default: dependencies
      require-summary:
        description: Require a "### Summary" section at the top of the description
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Labels and summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABELS_FILE: ${{ inputs.labels-file }}
          LOCAL_LABELS_FILE: ${{ inputs.local-labels-file }}
          REQUIRED_AXES: ${{ inputs.required-axes }}
          TRIAGE_AXES: ${{ inputs.triage-axes }}
          TRIAGE_LABEL: ${{ inputs.triage-label }}
          UMBRELLA_LABEL: ${{ inputs.umbrella-label }}
          UMBRELLA_AXES: ${{ inputs.umbrella-axes }}
          EXEMPT_LABELS: ${{ inputs.exempt-labels }}
          REQUIRE_SUMMARY: ${{ inputs.require-summary }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- harness:issue-hygiene -->';
            const FOOTER = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const list = (s) => (s || '').split(',').map((x) => x.trim()).filter(Boolean);
            const read = (p) => (fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : []);
            const declared = new Map();
            for (const l of [...read(process.env.LABELS_FILE), ...read(process.env.LOCAL_LABELS_FILE)]) {
              if (l.axis) declared.set(l.name, l.axis);
            }
            // Declared axis first; otherwise the `axis: value` prefix (a label added by hand, e.g. `type: lot`).
            const axisOf = (name) => declared.get(name) || (/^([a-z][a-z-]*): /.exec(name) || [])[1];
            const examples = (axis) => [...declared].filter(([, a]) => a === axis).map(([n]) => '`' + n + '`').join(', ');
            const namesOf = (issue) => issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            const triageLabel = process.env.TRIAGE_LABEL;
            const { owner, repo } = context.repo;

            function problems(issue, names) {
              if (names.some((n) => list(process.env.EXEMPT_LABELS).includes(n))) return [];
              const umbrella = names.includes(process.env.UMBRELLA_LABEL);
              const triage = list(process.env.TRIAGE_AXES);
              const untriaged = names.includes(triageLabel);
              const axes = (umbrella ? list(process.env.UMBRELLA_AXES) : [...list(process.env.REQUIRED_AXES), ...triage])
                .filter((axis) => !(untriaged && triage.includes(axis)));
              const out = [];
              for (const axis of axes) {
                const found = names.filter((n) => axisOf(n) === axis);
                if (found.length === 0) out.push(`axis **${axis}** has no label (${examples(axis)})`);
                else if (found.length > 1) out.push(`axis **${axis}** has several labels (${found.join(', ')}): keep exactly one`);
              }
              if (process.env.REQUIRE_SUMMARY === 'true' && !umbrella &&
                  !/^###[ \t]*Summary[ \t]*\r?\n\s*[^#\s]/im.test(issue.body || '')) {
                out.push('description has no `### Summary` section at the top (user story or two-line summary)');
              }
              return out;
            }

            if (context.eventName !== 'issues') {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              const rows = [];
              for (const issue of issues.filter((i) => !i.pull_request)) {
                const p = problems(issue, namesOf(issue));
                if (p.length) rows.push(`| #${issue.number} | ${p.join('; ').replace(/\|/g, '\\|')} |`);
              }
              await core.summary.addRaw(rows.length
                ? `### ${rows.length} issue(s) to complete\n\n| Issue | Missing |\n|---|---|\n${rows.join('\n')}\n`
                : '### 🟢 Every open issue has its labels\n').write();
              return;
            }

            const issue = context.payload.issue;
            const ref = { owner, repo, issue_number: issue.number };
            const names = namesOf(issue);
            if (context.payload.action === 'closed') {
              for (const name of names.filter((n) => axisOf(n) === 'status')) {
                await github.rest.issues.removeLabel({ ...ref, name })
                  .then(() => core.info(`removed on close: ${name}`))
                  .catch((e) => core.warning(`could not remove ${name}: ${e.message}`));
              }
              return;
            }
            if (['opened', 'reopened'].includes(context.payload.action) && triageLabel &&
                !names.some((n) => axisOf(n) === 'status') &&
                !names.some((n) => list(process.env.EXEMPT_LABELS).includes(n))) {
              await github.rest.issues.addLabels({ ...ref, labels: [triageLabel] })
                .then(() => { names.push(triageLabel); core.info(`added: ${triageLabel}`); })
                .catch((e) => core.warning(`could not add ${triageLabel}: ${e.message}`));
            }
            const p = problems(issue, names);
            const comments = await github.paginate(github.rest.issues.listComments, { ...ref, per_page: 100 });
            const mine = comments.find((c) => (c.body || '').includes(MARKER));
            if (!p.length) {
              if (mine) await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
              return;
            }
            const body = `${MARKER}\nTo complete before claiming the issue (agentic-harness, METHODOLOGY.md):\n\n` +
              p.map((x) => `- ${x}`).join('\n') + FOOTER;
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...ref, body });
            }
