name: Labels (reusable)

# Syncs the labels of the calling repository: vendored harness taxonomy (.harness/labels.json) + project-specific
# labels (.github/labels.local.json, which win on an equal name). Creates or updates, never deletes.
# `apply-aliases` renames an old label (`aliases` field, e.g. `P1 🔴` → `priority: high`, `bloqué` → `status: blocked`)
# instead of creating a new one: the issues keep their label. Enable it only after updating the project's workflows
# and docs that cite the old names. An alias is renamed only while its new name does not exist yet.
# GitHub default labels (bug, enhancement, question…) still present and unused by the harness set are listed in a
# notice, never deleted: remove them by hand.
# Reads the files of the calling repository: no access to the harness repository is needed at run time.
#
# The harness repository syncs its own labels with this same job (`push`, `workflow_dispatch`): the inputs are then
# empty, so the taxonomy is read from templates/.github/labels.json and the aliases are applied. A direct trigger, not
# a second workflow with a local `uses: ./…` call (flagged by zizmor, audit self-repository). These two triggers only
# exist in the harness repository: a consumer project calls this file, it does not copy it.
on:
  workflow_call:
    inputs:
      labels-file:
        description: Harness taxonomy, vendored by harness-sync.sh
        type: string
        default: .harness/labels.json
      local-labels-file:
        description: Project-specific labels (optional)
        type: string
        default: .github/labels.local.json
      apply-aliases:
        description: Rename the old labels listed in `aliases`
        type: boolean
        default: false
  push:
    branches: [master]
    paths: [templates/.github/labels.json, .github/labels.local.json, .github/workflows/labels-sync.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Empty inputs = direct run in the harness repository (see the header).
          LABELS_FILE: ${{ inputs.labels-file || 'templates/.github/labels.json' }}
          LOCAL_LABELS_FILE: ${{ inputs.local-labels-file || '.github/labels.local.json' }}
          APPLY_ALIASES: ${{ inputs.apply-aliases || !inputs.labels-file }}
        with:
          script: |
            const fs = require('fs');
            const read = (path, required) => {
              if (!fs.existsSync(path)) {
                if (required) throw new Error(`${path} not found: run harness-sync.sh`);
                return [];
              }
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            };
            const byName = new Map();
            for (const label of [...read(process.env.LABELS_FILE, true), ...read(process.env.LOCAL_LABELS_FILE, false)]) {
              byName.set(label.name, { ...(byName.get(label.name) || {}), ...label });
            }
            const { owner, repo } = context.repo;
            const exists = async (name) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); return true; }
              catch (error) { if (error.status === 404) return false; throw error; }
            };
            for (const label of byName.values()) {
              const fields = { name: label.name, color: label.color, description: (label.description || '').slice(0, 100) };
              if (await exists(label.name)) {
                await github.rest.issues.updateLabel({ owner, repo, ...fields });
                core.info(`updated: ${label.name}`);
                continue;
              }
              const alias = process.env.APPLY_ALIASES === 'true'
                ? await (async () => { for (const a of label.aliases || []) if (await exists(a)) return a; return null; })()
                : null;
              if (alias) {
                await github.rest.issues.updateLabel({ owner, repo, name: alias, new_name: label.name,
                  color: fields.color, description: fields.description });
                core.info(`renamed: ${alias} → ${label.name}`);
              } else {
                await github.rest.issues.createLabel({ owner, repo, ...fields });
                core.info(`created: ${label.name}`);
              }
            }

            // GitHub default labels left over (read after the renames, so an alias just renamed is not listed).
            const DEFAULTS = ['bug', 'documentation', 'duplicate', 'enhancement', 'good first issue', 'help wanted',
              'invalid', 'question', 'wontfix'];
            const wanted = new Set([...byName.keys()].map((n) => n.toLowerCase()));
            const aliases = new Set([...byName.values()].flatMap((l) => l.aliases || []).map((n) => n.toLowerCase()));
            const current = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const leftovers = current.map((l) => l.name)
              .filter((n) => DEFAULTS.includes(n.toLowerCase()) && !wanted.has(n.toLowerCase()));
            if (leftovers.length) {
              const old = leftovers.filter((n) => aliases.has(n.toLowerCase()));
              core.notice(`GitHub default labels still present and unused by the harness set: ${leftovers.join(', ')}. ` +
                'Nothing is deleted: remove them by hand once no issue carries them.' +
                (old.length ? ` Old names of harness labels (${old.join(', ')}): rename them with apply-aliases, ` +
                  'or move their issues to the new label if both exist.' : ''),
                { title: 'Unused default labels' });
            }
