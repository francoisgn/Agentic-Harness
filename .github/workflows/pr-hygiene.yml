name: PR hygiene (reusable)

# Cheap checks of a PR, in a single job (each job is billed per started minute, CI-BUDGET.md):
#   - branch flow: the base ← head pair must be listed in `flow` (empty = no check);
#   - issue link: `Closes #n` / `Refs #n` (or `Direct-PR: <reason>`, which sets the `direct-pr` label);
#   - non-empty "Changelog" section if `require-changelog`.
# A promotion PR (head in `promotion-heads`) and exempt authors (Dependabot) only go through the flow check.
# A draft only goes through the flow check: the rest is judged on the switch to "Ready for review".
# The body is read from the event, never interpolated into a shell; the PR code is not checked out.
on:
  workflow_call:
    inputs:
      flow:
        description: 'Allowed BASE:HEAD pairs separated by spaces, `*` permitted (e.g. "beta:develop beta:hotfix/* master:beta master:hotfix/*")'
        type: string
        default: ""
      flow-bases:
        description: Bases subject to the flow check (the others are free), separated by spaces
        type: string
        default: "beta master main"
      require-issue:
        type: boolean
        default: true
      require-changelog:
        type: boolean
        default: false
      changelog-heading:
        type: string
        default: "## Changelog"
      promotion-heads:
        type: string
        default: "develop beta"
      exempt-authors:
        type: string
        default: "dependabot[bot]"

permissions:
  contents: read

jobs:
  check:
    name: Flow, issue, changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # `direct-pr` label only
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLOW: ${{ inputs.flow }}
          FLOW_BASES: ${{ inputs.flow-bases }}
          REQUIRE_ISSUE: ${{ inputs.require-issue }}
          REQUIRE_CHANGELOG: ${{ inputs.require-changelog }}
          CHANGELOG_HEADING: ${{ inputs.changelog-heading }}
          PROMOTION_HEADS: ${{ inputs.promotion-heads }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.info('Not a PR: nothing to check.'); return; }
            const words = (s) => (s || '').split(/\s+/).filter(Boolean);
            const glob = (p) => new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
            const base = pr.base.ref, head = pr.head.ref;
            const errors = [];

            if (process.env.FLOW && words(process.env.FLOW_BASES).includes(base)) {
              const ok = words(process.env.FLOW).some((pair) => {
                const [b, h] = pair.split(':');
                return b === base && glob(h || '').test(head);
              });
              if (!ok) errors.push(`forbidden flow: ${head} → ${base} (allowed: ${process.env.FLOW})`);
            }

            const exempt = words(process.env.EXEMPT_AUTHORS).includes(pr.user.login)
              || words(process.env.PROMOTION_HEADS).includes(head);
            if (!pr.draft && !exempt) {
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const direct = /^Direct-PR:[ \t]*\S/im.test(body);
              const linked = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)[ \t]+(?:[\w.-]+\/[\w.-]+)?#\d+/i.test(body);
              if (process.env.REQUIRE_ISSUE === 'true' && !linked && !direct) {
                errors.push('no linked issue: one `Closes #n` line per issue (or `Refs #n`, or `Direct-PR: <reason>`)');
              }
              if (direct && !pr.labels.some((l) => l.name === 'direct-pr')) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['direct-pr'] })
                  .catch((e) => core.warning(`direct-pr label not set: ${e.message}`));
              }
              if (process.env.REQUIRE_CHANGELOG === 'true') {
                const heading = process.env.CHANGELOG_HEADING.trim();
                const at = body.split(/\r?\n/).findIndex((l) => l.trim().toLowerCase() === heading.toLowerCase());
                const section = at < 0 ? [] : body.split(/\r?\n/).slice(at + 1);
                const end = section.findIndex((l) => /^#{1,2}\s/.test(l));
                const content = (end < 0 ? section : section.slice(0, end)).map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
                if (!content.length) errors.push(`section "${heading}" missing or empty (write "None" if nothing is visible)`);
              }
            }

            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info(`🟢 ${head} → ${base}: compliant${pr.draft ? ' (draft: flow only)' : ''}.`);
