name: PR hygiene (reusable)

# Cheap checks of a PR, in a single job (each job is billed per started minute, CI-BUDGET.md):
#   - branch flow: the base ← head pair must be listed in `flow` (empty = no check);
#   - issue link: `Closes #n` / `Refs #n` (or `Direct-PR: <reason>`, which sets the `direct-pr` label);
#   - ledger (`ledger-label` not empty, CONVENTIONS.md §Ledger): the `### Ledger` section alone is the entry, no label
#     is asked of the author; a malformed entry (block without a type, block not closed, `None` without a reason)
#     fails with the entry and the expected format; the label without entry blocks is one notice (stale label);
#   - doc impact (`docs-code-paths` not empty): a PR that changes code paths has a `Docs:` line (in the ledger
#     section, else in the body) naming existing doc files or `none (<reason>)`; one warning, never a failure;
#   - warning (never a failure) if `integration-branch` is not the repository default branch: GitHub runs
#     issues, issue_comment, pull_request_target and schedule workflows from the default branch only;
#   - non-empty "Changelog" section if `require-changelog` (old convention, replaced by the ledger).
# A promotion PR (head in `promotion-heads`) and exempt authors (Dependabot) only go through the flow check.
# A draft only goes through the flow check: the rest is judged on the switch to "Ready for review".
# The body is read from the event, never interpolated into a shell; the PR code is not checked out.
on:
  workflow_call:
    inputs:
      flow:
        description: 'Allowed BASE:HEAD pairs separated by spaces, `*` permitted (e.g. "beta:develop beta:hotfix/* master:beta master:hotfix/*")'
        type: string
        default: ""
      flow-bases:
        description: Bases subject to the flow check (the others are free), separated by spaces
        type: string
        default: "beta master main"
      require-issue:
        type: boolean
        default: true
      ledger-label:
        description: Ledger label (e.g. `ledger`); empty = the project keeps no ledger, nothing is checked. Not required on a PR (the section is the entry); a stale one gets a notice
        type: string
        default: ""
      ledger-heading:
        type: string
        default: "### Ledger"
      require-changelog:
        description: Old convention ("Changelog" section); prefer the ledger (`ledger-label`)
        type: boolean
        default: false
      changelog-heading:
        type: string
        default: "## Changelog"
      promotion-heads:
        type: string
        default: "develop beta"
      exempt-authors:
        type: string
        default: "dependabot[bot]"
      docs-code-paths:
        description: 'Globs of the code paths whose change asks for a `Docs:` line (CONVENTIONS.md §Ledger; `.md` files never count); a warning, never a failure. Empty = no check'
        type: string
        default: "*"
      integration-branch:
        description: The project's integration branch (`.harness/config.json`); if it is not the default branch, a warning is emitted (never a failure). Empty = no check
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Flow, issue, changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # `direct-pr` label only
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLOW: ${{ inputs.flow }}
          FLOW_BASES: ${{ inputs.flow-bases }}
          REQUIRE_ISSUE: ${{ inputs.require-issue }}
          LEDGER_LABEL: ${{ inputs.ledger-label }}
          LEDGER_HEADING: ${{ inputs.ledger-heading }}
          REQUIRE_CHANGELOG: ${{ inputs.require-changelog }}
          CHANGELOG_HEADING: ${{ inputs.changelog-heading }}
          PROMOTION_HEADS: ${{ inputs.promotion-heads }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
          DOCS_CODE_PATHS: ${{ inputs.docs-code-paths }}
          INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.info('Not a PR: nothing to check.'); return; }
            const words = (s) => (s || '').split(/\s+/).filter(Boolean);
            const glob = (p) => new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
            const base = pr.base.ref, head = pr.head.ref;
            const errors = [];

            const integration = (process.env.INTEGRATION_BRANCH || '').trim();
            if (integration) {
              const def = (process.env.DEFAULT_BRANCH || '').trim();
              if (!def) core.warning(`Could not check whether the integration branch "${integration}" is the default branch.`);
              else if (def !== integration) core.warning(`Integration branch "${integration}" is not the default branch "${def}": GitHub runs issues, issue_comment, pull_request_target and schedule workflows from the default branch only, so label hygiene, claims, the dashboard and the weekly jobs stay silent.`);
            }

            if (process.env.FLOW && words(process.env.FLOW_BASES).includes(base)) {
              const ok = words(process.env.FLOW).some((pair) => {
                const [b, h] = pair.split(':');
                return b === base && glob(h || '').test(head);
              });
              if (!ok) errors.push(`forbidden flow: ${head} → ${base} (allowed: ${process.env.FLOW})`);
            }

            const exempt = words(process.env.EXEMPT_AUTHORS).includes(pr.user.login)
              || words(process.env.PROMOTION_HEADS).includes(head);
            if (!pr.draft && !exempt) {
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const direct = /^Direct-PR:[ \t]*\S/im.test(body);
              const linked = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)[ \t]+(?:[\w.-]+\/[\w.-]+)?#\d+/i.test(body);
              if (process.env.REQUIRE_ISSUE === 'true' && !linked && !direct) {
                errors.push('no linked issue: one `Closes #n` line per issue (or `Refs #n`, or `Direct-PR: <reason>`)');
              }
              if (direct && !pr.labels.some((l) => l.name === 'direct-pr')) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['direct-pr'] })
                  .catch((e) => core.warning(`direct-pr label not set: ${e.message}`));
              }
              const ledgerLabel = (process.env.LEDGER_LABEL || '').trim();
              let docsWhere = body.split(/\r?\n/);
              if (ledgerLabel) {
                const heading = process.env.LEDGER_HEADING.trim().toLowerCase();
                const lines = body.split(/\r?\n/);
                const at = lines.findIndex((l) => l.trim().toLowerCase() === heading);
                // The section runs to the next heading of level 1 to 3, outside fenced blocks. It alone is the entry
                // (same parsing as doc-steward.py ledger_section): typed blocks are entries, `None (<reason>)` the
                // explicit empty section; the label is the steward's bookkeeping, never asked of the author.
                const name = process.env.LEDGER_HEADING.trim();
                const format = 'expected: one fenced block per entry whose language is the entry type (```changelog … ```), or the line `None (<reason>)` when the PR has no entry';
                const quote = (s) => `"${(s || '').trim().slice(0, 80)}"`;
                let blocks = 0, fence = null, kind = '', first = null, none = null;
                const bad = [];
                docsWhere = [];
                for (const l of at < 0 ? [] : lines.slice(at + 1)) {
                  const m = l.match(/^\s*(```+|~~~+)(\S*)/);
                  if (fence) {
                    if (m && m[1][0] === fence[0] && m[1].length >= fence.length && !m[2]) {
                      if (kind) blocks += 1; else bad.push(`block without an entry type (\`${fence}\` then ${quote(first)})`);
                      fence = null;
                    } else if (first === null) first = l;
                    continue;
                  }
                  if (m) { fence = m[1]; kind = m[2]; first = null; continue; }
                  if (/^#{1,3}\s/.test(l)) break;
                  const n = l.match(/^\s*(?:[-*]\s+)?None\b(.*)$/i);
                  if (n && none === null) none = n[1];
                  docsWhere.push(l);
                }
                if (fence) bad.push(`block \`${fence}${kind}\` not closed (${quote(first)})`);
                if (none !== null && !/^\s*\(\s*\S[^)]*\)/.test(none)) bad.push('`None` without a reason');
                else if (none !== null && blocks) bad.push('`None (…)` next to entry blocks');
                if (bad.length) errors.push(`malformed "${name}" section: ${bad.join('; ')}; ${format}`);
                if (!blocks && pr.labels.some((l) => l.name === ledgerLabel)) {
                  core.notice(`Stale label \`${ledgerLabel}\`: no entry block in "${name}". The section is the entry; the steward handles the labels (CONVENTIONS.md §Ledger).`);
                }
              }
              // Doc impact (CONVENTIONS.md §Ledger): warn once, never fail
              const codeGlobs = words(process.env.DOCS_CODE_PATHS).map(glob);
              if (codeGlobs.length) {
                const where = ledgerLabel ? `the "${process.env.LEDGER_HEADING.trim()}" section` : 'the PR body';
                const line = docsWhere.map((l) => l.match(/^\s*(?:[-*]\s+)?Docs:[ \t]*(.*)$/i)).find(Boolean);
                const notes = [];
                if (!line) {
                  const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
                  const code = files.map((f) => f.filename).find((f) => !/\.md$/i.test(f) && codeGlobs.some((g) => g.test(f)));
                  if (code) notes.push(`no \`Docs:\` line in ${where} although code paths change (${code}): list the doc files to update, or write \`Docs: none (<reason>)\``);
                } else if (/^none\b/i.test(line[1].trim())) {
                  if (!/\(\s*\S[^)]*\)/.test(line[1])) notes.push('`Docs: none` without a reason: write `Docs: none (<reason>)`');
                } else {
                  const paths = line[1].replace(/\[[^\]]*\]\(([^)]*)\)/g, '$1').replace(/`/g, '').split(/[,\s]+/).filter(Boolean).slice(0, 20);
                  const missing = [];
                  for (const path of paths) {
                    await github.rest.repos.getContent({ ...context.repo, path: path.replace(/^\.?\//, ''), ref: pr.head.sha })
                      .catch((e) => { if (e.status === 404) missing.push(path); else core.info(`${path} not checked: ${e.message}`); });
                  }
                  if (missing.length) notes.push(`\`Docs:\` names files that do not exist on the PR head: ${missing.join(', ')}`);
                  if (!paths.length) notes.push(`empty \`Docs:\` line in ${where}: list the doc files to update, or write \`Docs: none (<reason>)\``);
                }
                if (notes.length) core.warning(`Doc impact: ${notes.join('; ')} (CONVENTIONS.md §Ledger).`);
              }
              if (process.env.REQUIRE_CHANGELOG === 'true') {
                const heading = process.env.CHANGELOG_HEADING.trim();
                const at = body.split(/\r?\n/).findIndex((l) => l.trim().toLowerCase() === heading.toLowerCase());
                const section = at < 0 ? [] : body.split(/\r?\n/).slice(at + 1);
                const end = section.findIndex((l) => /^#{1,2}\s/.test(l));
                const content = (end < 0 ? section : section.slice(0, end)).map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
                if (!content.length) errors.push(`section "${heading}" missing or empty (write "None" if nothing is visible)`);
              }
            }

            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info(`🟢 ${head} → ${base}: compliant${pr.draft ? ' (draft: flow only)' : ''}.`);
