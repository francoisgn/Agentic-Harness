name: PR hygiene (reusable)

# Cheap checks of a PR, in a single job (each job is billed per started minute, CI-BUDGET.md):
#   - branch flow: the base ← head pair must be listed in `flow` (empty = no check);
#   - issue link: `Closes #n` / `Refs #n` (or `Direct-PR: <reason>`, which sets the `direct-pr` label);
#   - ledger (`ledger-label` not empty, CONVENTIONS.md §Ledger): a PR that carries this label has a `### Ledger`
#     section with at least one fenced block, and a PR that has this section carries the label;
#   - warning (never a failure) if `integration-branch` is not the repository default branch: GitHub runs
#     issues, issue_comment, pull_request_target and schedule workflows from the default branch only;
#   - non-empty "Changelog" section if `require-changelog` (old convention, replaced by the ledger).
# A promotion PR (head in `promotion-heads`) and exempt authors (Dependabot) only go through the flow check.
# A draft only goes through the flow check: the rest is judged on the switch to "Ready for review".
# The body is read from the event, never interpolated into a shell; the PR code is not checked out.
on:
  workflow_call:
    inputs:
      flow:
        description: 'Allowed BASE:HEAD pairs separated by spaces, `*` permitted (e.g. "beta:develop beta:hotfix/* master:beta master:hotfix/*")'
        type: string
        default: ""
      flow-bases:
        description: Bases subject to the flow check (the others are free), separated by spaces
        type: string
        default: "beta master main"
      require-issue:
        type: boolean
        default: true
      ledger-label:
        description: Ledger label (e.g. `ledger`); empty = the project keeps no ledger, nothing is checked
        type: string
        default: ""
      ledger-heading:
        type: string
        default: "### Ledger"
      require-changelog:
        description: Old convention ("Changelog" section); prefer the ledger (`ledger-label`)
        type: boolean
        default: false
      changelog-heading:
        type: string
        default: "## Changelog"
      promotion-heads:
        type: string
        default: "develop beta"
      exempt-authors:
        type: string
        default: "dependabot[bot]"
      integration-branch:
        description: The project's integration branch (`.harness/config.json`); if it is not the default branch, a warning is emitted (never a failure). Empty = no check
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Flow, issue, changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # `direct-pr` label only
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLOW: ${{ inputs.flow }}
          FLOW_BASES: ${{ inputs.flow-bases }}
          REQUIRE_ISSUE: ${{ inputs.require-issue }}
          LEDGER_LABEL: ${{ inputs.ledger-label }}
          LEDGER_HEADING: ${{ inputs.ledger-heading }}
          REQUIRE_CHANGELOG: ${{ inputs.require-changelog }}
          CHANGELOG_HEADING: ${{ inputs.changelog-heading }}
          PROMOTION_HEADS: ${{ inputs.promotion-heads }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
          INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.info('Not a PR: nothing to check.'); return; }
            const words = (s) => (s || '').split(/\s+/).filter(Boolean);
            const glob = (p) => new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
            const base = pr.base.ref, head = pr.head.ref;
            const errors = [];

            const integration = (process.env.INTEGRATION_BRANCH || '').trim();
            if (integration) {
              const def = (process.env.DEFAULT_BRANCH || '').trim();
              if (!def) core.warning(`Could not check whether the integration branch "${integration}" is the default branch.`);
              else if (def !== integration) core.warning(`Integration branch "${integration}" is not the default branch "${def}": GitHub runs issues, issue_comment, pull_request_target and schedule workflows from the default branch only, so label hygiene, claims, the dashboard and the weekly jobs stay silent.`);
            }

            if (process.env.FLOW && words(process.env.FLOW_BASES).includes(base)) {
              const ok = words(process.env.FLOW).some((pair) => {
                const [b, h] = pair.split(':');
                return b === base && glob(h || '').test(head);
              });
              if (!ok) errors.push(`forbidden flow: ${head} → ${base} (allowed: ${process.env.FLOW})`);
            }

            const exempt = words(process.env.EXEMPT_AUTHORS).includes(pr.user.login)
              || words(process.env.PROMOTION_HEADS).includes(head);
            if (!pr.draft && !exempt) {
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const direct = /^Direct-PR:[ \t]*\S/im.test(body);
              const linked = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)[ \t]+(?:[\w.-]+\/[\w.-]+)?#\d+/i.test(body);
              if (process.env.REQUIRE_ISSUE === 'true' && !linked && !direct) {
                errors.push('no linked issue: one `Closes #n` line per issue (or `Refs #n`, or `Direct-PR: <reason>`)');
              }
              if (direct && !pr.labels.some((l) => l.name === 'direct-pr')) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['direct-pr'] })
                  .catch((e) => core.warning(`direct-pr label not set: ${e.message}`));
              }
              const ledgerLabel = (process.env.LEDGER_LABEL || '').trim();
              if (ledgerLabel) {
                const heading = process.env.LEDGER_HEADING.trim().toLowerCase();
                const lines = body.split(/\r?\n/);
                const at = lines.findIndex((l) => l.trim().toLowerCase() === heading);
                // The section runs to the next heading of level 1 to 3, outside fenced blocks; count its typed blocks
                let blocks = 0, fence = null;
                for (const l of at < 0 ? [] : lines.slice(at + 1)) {
                  const m = l.match(/^\s*(```+|~~~+)(\S*)/);
                  if (fence) { if (m && m[1][0] === fence[0] && m[1].length >= fence.length && !m[2]) fence = null; continue; }
                  if (m) { fence = m[1]; if (m[2]) blocks += 1; continue; }
                  if (/^#{1,3}\s/.test(l)) break;
                }
                const labelled = pr.labels.some((l) => l.name === ledgerLabel);
                if (labelled && !blocks) errors.push(`label \`${ledgerLabel}\` without a "${process.env.LEDGER_HEADING.trim()}" section or an entry block`);
                if (!labelled && at >= 0) errors.push(`section "${process.env.LEDGER_HEADING.trim()}" without the label \`${ledgerLabel}\` (ask a member: setting or removing the label reruns this check)`);
              }
              if (process.env.REQUIRE_CHANGELOG === 'true') {
                const heading = process.env.CHANGELOG_HEADING.trim();
                const at = body.split(/\r?\n/).findIndex((l) => l.trim().toLowerCase() === heading.toLowerCase());
                const section = at < 0 ? [] : body.split(/\r?\n/).slice(at + 1);
                const end = section.findIndex((l) => /^#{1,2}\s/.test(l));
                const content = (end < 0 ? section : section.slice(0, end)).map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
                if (!content.length) errors.push(`section "${heading}" missing or empty (write "None" if nothing is visible)`);
              }
            }

            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info(`🟢 ${head} → ${base}: compliant${pr.draft ? ' (draft: flow only)' : ''}.`);
