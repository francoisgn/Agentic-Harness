name: Repository settings (reusable)

# Applies .github/repo-settings.json (description, topics, rulesets) with an administration token: a cloud
# session cannot change the settings (LESSONS L56), it changes this file by PR and the CI applies it on merge.
#   - `apply: true` (push to the default branch, manual run): applies the differences;
#   - `apply: false` (scheduled): drift check; fails if someone changed a setting by hand.
# Secret REPO_ADMIN_TOKEN: fine-grained token limited to THIS repository, "Administration: read and write" (+ "Metadata:
# read"). Missing → a warning and nothing else (the repository stays usable before the token is created).
on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
      file:
        type: string
        default: ".github/repo-settings.json"
      script:
        type: string
        default: ".harness/scripts/repo-settings.py"
    secrets:
      REPO_ADMIN_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  settings:
    name: Repository settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply or check
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          APPLY: ${{ inputs.apply }}
          FILE: ${{ inputs.file }}
          SCRIPT: ${{ inputs.script }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret REPO_ADMIN_TOKEN missing: settings not applied (docs/ADOPTION.md §Repository settings)"
            exit 0
          fi
          if [ "$APPLY" = "true" ]; then
            python3 "$SCRIPT" --repo "$GITHUB_REPOSITORY" --file "$FILE" --apply
          else
            python3 "$SCRIPT" --repo "$GITHUB_REPOSITORY" --file "$FILE" \
              || { echo "::error::Drift: a setting was changed outside the file (see the plan above)"; exit 1; }
          fi
