name: Code security (reusable)

# SAST + SCA + secrets pipeline, free and with no third-party account (CI-BUDGET.md §3), in ONE job: each tool runs even
# if the previous one fails, one run gives every finding. Nothing on a draft (it runs on the switch to "Ready").
#   - SAST: Semgrep CE (registry rules, `semgrep-configs`);
#   - SCA: Trivy `fs` (declared dependencies, HIGH/CRITICAL, fixable only by default);
#   - hard-coded secrets: gitleaks (PR history, or the whole history outside a PR) + Semgrep `p/secrets` rules.
# Public repository: CodeQL + Dependency Review + secret scanning are free and better; keep this workflow for
# Trivy and gitleaks, turn Semgrep off (`semgrep: false`) if CodeQL covers the language.
# Weekly call recommended (`schedule` in the project's harness.yml): a CVE arrives without a commit.
on:
  workflow_call:
    inputs:
      semgrep:
        type: boolean
        default: true
      semgrep-configs:
        description: Semgrep rules separated by spaces (e.g. "p/default p/secrets p/swift p/github-actions")
        type: string
        default: "p/default p/secrets p/github-actions"
      trivy:
        type: boolean
        default: true
      trivy-severity:
        type: string
        default: "HIGH,CRITICAL"
      trivy-ignore-unfixed:
        type: boolean
        default: true
      gitleaks:
        description: Set to false if docs-security.yml already runs on the same event (do not pay twice)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: SAST · SCA · secrets
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks reads the history

      # Named registry rules (`p/…`): usable without metrics; `--config auto` would require them (to confirm on the
      # first real run, otherwise switch to --metrics=auto).
      - name: SAST · Semgrep CE
        if: ${{ !cancelled() && inputs.semgrep }}
        env:
          CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          ARGS=()
          for c in $CONFIGS; do ARGS+=(--config "$c"); done
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.122.0 \
            semgrep scan "${ARGS[@]}" --error --metrics=off --disable-version-check

      - name: SCA · Trivy (dependencies)
        if: ${{ !cancelled() && inputs.trivy }}
        env:
          SEVERITY: ${{ inputs.trivy-severity }}
          UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
        run: |
          EXTRA=()
          [ "$UNFIXED" = "true" ] && EXTRA+=(--ignore-unfixed)
          docker run --rm -v "$PWD":/src aquasec/trivy:0.62.1 fs /src \
            --scanners vuln --severity "$SEVERITY" --exit-code 1 --no-progress "${EXTRA[@]}"

      - name: Secrets · gitleaks
        if: ${{ !cancelled() && inputs.gitleaks }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then LOG_OPTS="$BASE_SHA..HEAD"; else LOG_OPTS=--all; fi
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$LOG_OPTS" --redact --no-banner --exit-code 1
