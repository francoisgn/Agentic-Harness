name: Settings

# Repository settings of the harness "as code" (.github/repo-settings.json): applied on merge, drift checked every
# week. Same logic as the reusable workflow repo-settings.yml used by projects, as a direct job here (the harness runs
# its own script; a local call `uses: ./…` is flagged by zizmor, audit self-repository).
# Secret REPO_ADMIN_TOKEN: fine-grained token limited to this repository, "Administration: read and write". Missing → warning.
# The labels of the harness repository are synced by labels-sync.yml itself (its `push` trigger).
on:
  push:
    branches: [master]
    paths: [.github/repo-settings.json, scripts/repo-settings.py, .github/workflows/settings.yml]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-settings
  cancel-in-progress: false

jobs:
  settings:
    name: Repository settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply or check
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret REPO_ADMIN_TOKEN missing: settings not applied (docs/ADOPTION.md §Repository settings)"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            python3 scripts/repo-settings.py --repo "$GITHUB_REPOSITORY" \
              || { echo "::error::Drift: a setting was changed outside the file (see the plan above)"; exit 1; }
          else
            python3 scripts/repo-settings.py --repo "$GITHUB_REPOSITORY" --apply
          fi
