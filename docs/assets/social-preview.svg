<title id="t">agentic-harness</title>
<desc id="d">À gauche, des trajectoires d'agents emmêlées ; elles passent dans la boucle d'un harnais et ressortent en voies parallèles qui franchissent quatre jalons (intention, TDD, revue adversariale, CI) jusqu'au merge ; un retour en pointillé ramène les leçons vers le harnais.</desc>
