<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 1198 812" width="1198" height="812" role="img"><rect x="16" y="-4" width="1198" height="812" fill="#ffffff"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#1e1e1e" text-anchor="start" dominant-baseline="central"><tspan x="40.0" y="40.0">The four layers of an AI product</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#757575" text-anchor="start" dominant-baseline="central"><tspan x="40.0" y="77.2">one question per layer; each is a separate choice, with its own risks and its own contract</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" dominant-baseline="central"><tspan x="830.0" y="130.5">Chatbot</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" dominant-baseline="central"><tspan x="1000.0" y="130.5">Agent on your</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" dominant-baseline="central"><tspan x="1000.0" y="154.5">behalf (OBO)</tspan></text><g opacity="1.0"><rect x="40" y="180" width="330" height="110" rx="16" fill="#a5d8ff"/><rect x="40.1" y="179.9" width="329.9" height="110.1" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><rect x="39.2" y="180.8" width="330.8" height="109.2" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="205.0" y="222.5">1. Presentation</tspan><tspan x="205.0" y="247.5">where do I talk to it?</tspan></text></g><g opacity="1.0"><rect x="390" y="180" width="400" height="110" rx="16" fill="#ffffff"/><rect x="389.2" y="180.8" width="400.8" height="109.2" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><rect x="390.7" y="179.3" width="399.3" height="110.7" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="590.0" y="224.4">chat app, terminal, IDE extension,</tspan><tspan x="590.0" y="245.6">web or desktop app, phone</tspan></text></g><g opacity="1.0"><rect x="820" y="180" width="180" height="110" rx="16" fill="#a5d8ff"/><rect x="818.9" y="181.1" width="181.1" height="108.9" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><rect x="819.8" y="180.2" width="180.2" height="109.8" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="910.0" y="224.4">you type,</tspan><tspan x="910.0" y="245.6">it answers</tspan></text></g><g opacity="1.0"><rect x="1010" y="180" width="180" height="110" rx="16" fill="#a5d8ff"/><rect x="1009.5" y="180.5" width="180.5" height="109.5" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><rect x="1011.1" y="178.9" width="178.9" height="111.1" rx="16" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="1100.0" y="224.4">you ask, watch,</tspan><tspan x="1100.0" y="245.6">approve</tspan></text></g><g opacity="1.0"><rect x="40" y="310" width="330" height="110" rx="16" fill="#b2f2bb"/><rect x="41.1" y="308.9" width="328.9" height="111.1" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><rect x="41.0" y="309.0" width="329.0" height="111.0" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="205.0" y="352.5">2. Agent</tspan><tspan x="205.0" y="377.5">what decides and acts?</tspan></text></g><g opacity="1.0"><rect x="390" y="310" width="400" height="110" rx="16" fill="#ffffff"/><rect x="390.3" y="309.7" width="399.7" height="110.3" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><rect x="389.2" y="310.8" width="400.8" height="109.2" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="590.0" y="354.4">the harness: a loop where the model</tspan><tspan x="590.0" y="375.6">asks for an action, a tool does it</tspan></text></g><g opacity="1.0"><rect x="820" y="310" width="180" height="110" rx="16" fill="#f8f9fa"/><rect x="819.6" y="310.4" width="180.4" height="109.6" rx="16" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/><rect x="820.2" y="309.8" width="179.8" height="110.2" rx="16" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="910.0" y="365.0">none</tspan></text></g><g opacity="1.0"><rect x="1010" y="310" width="180" height="110" rx="16" fill="#b2f2bb"/><rect x="1010.9" y="309.1" width="179.1" height="110.9" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><rect x="1009.2" y="310.8" width="180.8" height="109.2" rx="16" fill="none" stroke="#2f9e44" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="1100.0" y="354.4">decides the</tspan><tspan x="1100.0" y="375.6">next action</tspan></text></g><g opacity="1.0"><rect x="40" y="440" width="330" height="110" rx="16" fill="#ffec99"/><rect x="38.9" y="441.1" width="331.1" height="108.9" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="38.8" y="441.2" width="331.2" height="108.8" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="205.0" y="482.5">3. Execution</tspan><tspan x="205.0" y="507.5">where does it act?</tspan></text></g><g opacity="1.0"><rect x="390" y="440" width="400" height="110" rx="16" fill="#ffffff"/><rect x="388.8" y="441.2" width="401.2" height="108.8" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="389.3" y="440.7" width="400.7" height="109.3" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="590.0" y="484.4">your machine, or a vendor's cloud:</tspan><tspan x="590.0" y="505.6">it sets what the agent can touch</tspan></text></g><g opacity="1.0"><rect x="820" y="440" width="180" height="110" rx="16" fill="#f8f9fa"/><rect x="818.8" y="441.2" width="181.2" height="108.8" rx="16" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/><rect x="820.2" y="439.8" width="179.8" height="110.2" rx="16" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="910.0" y="495.0">none</tspan></text></g><g opacity="1.0"><rect x="1010" y="440" width="180" height="110" rx="16" fill="#ffec99"/><rect x="1009.2" y="440.8" width="180.8" height="109.2" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="1009.0" y="441.0" width="181.0" height="109.0" rx="16" fill="none" stroke="#e8590c" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="1100.0" y="473.8">acts in your</tspan><tspan x="1100.0" y="495.0">files, with</tspan><tspan x="1100.0" y="516.2">your rights</tspan></text></g><g opacity="1.0"><rect x="40" y="570" width="330" height="110" rx="16" fill="#eebefa"/><rect x="41.0" y="569.0" width="329.0" height="111.0" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><rect x="39.8" y="570.2" width="330.2" height="109.8" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="205.0" y="612.5">4. Inference</tspan><tspan x="205.0" y="637.5">which model answers?</tspan></text></g><g opacity="1.0"><rect x="390" y="570" width="400" height="110" rx="16" fill="#ffffff"/><rect x="389.3" y="570.7" width="400.7" height="109.3" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><rect x="389.6" y="570.4" width="400.4" height="109.6" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="590.0" y="614.4">model vendor, cloud platform or tool</tspan><tspan x="590.0" y="635.6">vendor: the seller sets the contract</tspan></text></g><g opacity="1.0"><rect x="820" y="570" width="180" height="110" rx="16" fill="#eebefa"/><rect x="820.4" y="569.6" width="179.6" height="110.4" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><rect x="820.1" y="569.9" width="179.9" height="110.1" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="910.0" y="614.4">the model</tspan><tspan x="910.0" y="635.6">answers</tspan></text></g><g opacity="1.0"><rect x="1010" y="570" width="180" height="110" rx="16" fill="#eebefa"/><rect x="1009.3" y="570.7" width="180.7" height="109.3" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><rect x="1008.9" y="571.1" width="181.1" height="108.9" rx="16" fill="none" stroke="#9c36b5" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="1100.0" y="614.4">the model</tspan><tspan x="1100.0" y="635.6">answers</tspan></text></g><g opacity="1.0"><rect x="40" y="710" width="1150" height="74" rx="16" fill="#f1f3f5"/><rect x="39.6" y="710.4" width="1150.4" height="73.6" rx="16" fill="none" stroke="#495057" stroke-width="2"/><rect x="40.6" y="709.4" width="1149.4" height="74.6" rx="16" fill="none" stroke="#495057" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="615.0" y="735.8">"We use X" says little until each layer is decided:</tspan><tspan x="615.0" y="758.2">who sells and operates the inference sets the contract that governs your data</tspan></text></g></svg>
