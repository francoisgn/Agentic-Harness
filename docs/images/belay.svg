<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Belayed agents: the operator holds the rope, the agent climbs lot by lot, each anchor is a guardrail</title>
  <desc id="d">A climber (the coding agent) goes up a wall whose holds are lots. The rope runs through four anchors named intent, tests, review and CI, down to a belayer on the ground (the operator and the orchestrator). The summit is a shipped release; the repository at the foot of the wall holds the state.</desc>
  <rect width="1200" height="520" fill="#0f172a"/>
  <!-- wall -->
  <path d="M640 520 L700 430 L680 330 L735 235 L715 135 L770 40 L1200 40 L1200 520 Z" fill="#1e293b"/>
  <path d="M640 520 L700 430 L680 330 L735 235 L715 135 L770 40" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
  <!-- strata -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M760 480 L900 470 L1010 486 L1200 474"/><path d="M745 370 L880 384 L1040 368 L1200 380"/>
    <path d="M770 262 L930 250 L1060 268 L1200 256"/><path d="M760 152 L900 166 L1070 150 L1200 160"/>
  </g>
  <!-- summit flag -->
  <path d="M770 40 L770 4" stroke="#e2e8f0" stroke-width="3"/><path d="M770 6 L816 16 L770 28 Z" fill="#22c55e"/>
  <text x="826" y="22" fill="#86efac" font-size="17" font-weight="600">shipped</text>
  <!-- holds = lots -->
  <g font-size="15" fill="#cbd5e1">
    <g fill="#22c55e"><ellipse cx="760" cy="452" rx="15" ry="9"/><ellipse cx="748" cy="352" rx="15" ry="9"/></g>
    <ellipse cx="786" cy="262" rx="15" ry="9" fill="#38bdf8"/>
    <g fill="#64748b"><ellipse cx="775" cy="170" rx="15" ry="9"/><ellipse cx="812" cy="92" rx="15" ry="9"/></g>
    <text x="784" y="457">LOT-001 · shipped</text><text x="772" y="357">LOT-002 · shipped</text>
    <text x="810" y="267" fill="#7dd3fc">LOT-003 · in progress</text>
    <text x="799" y="175" fill="#94a3b8">LOT-004 · ready</text><text x="836" y="97" fill="#94a3b8">LOT-005 · to triage</text>
  </g>
  <!-- rope: belayer -> anchors -> climber -->
  <path d="M262 400 C 360 474, 560 478, 694 432 L 676 334 L 709 280 L 730 262" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- anchors = guardrails -->
  <g font-size="15" font-weight="600">
    <g fill="#0f172a" stroke="#fbbf24" stroke-width="3"><circle cx="694" cy="432" r="8"/><circle cx="676" cy="334" r="8"/><circle cx="709" cy="280" r="8"/></g>
    <g fill="#0f172a" stroke="#64748b" stroke-width="3" stroke-dasharray="4 3"><circle cx="712" cy="140" r="8"/></g>
    <g fill="#fcd34d" text-anchor="end"><text x="672" y="420">intent</text><text x="658" y="339">tests</text><text x="690" y="285">review</text></g>
    <text x="694" y="145" fill="#94a3b8" text-anchor="end">CI</text>
  </g>
  <!-- climber = agent -->
  <g stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="742" cy="196" r="13" fill="#e2e8f0" stroke="none"/>
    <path d="M740 210 L730 262"/><path d="M738 222 L776 256"/><path d="M736 224 L716 196"/>
    <path d="M730 262 L752 300 L748 340"/><path d="M730 262 L708 296 L716 326"/>
  </g>
  <text x="640" y="182" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="end">agent</text>
  <text x="640" y="202" fill="#94a3b8" font-size="14" text-anchor="end">disposable, one lot at a time</text>
  <!-- ground -->
  <path d="M0 470 L640 470" stroke="#475569" stroke-width="3"/>
  <!-- belayer = operator -->
  <g stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="226" cy="352" r="13" fill="#e2e8f0" stroke="none"/>
    <path d="M226 366 L222 420"/><path d="M225 380 L262 400"/><path d="M225 382 L250 412"/>
    <path d="M222 420 L204 468"/><path d="M222 420 L244 468"/>
  </g>
  <text x="226" y="318" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="middle">operator + orchestrator</text>
  <text x="226" y="496" fill="#94a3b8" font-size="14" text-anchor="middle">holds the rope, decides, never climbs for the agent</text>
  <!-- repo = state at the foot -->
  <g transform="translate(36 404)"><rect width="150" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="75" y="22" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">repository</text>
    <text x="75" y="41" fill="#94a3b8" font-size="13" text-anchor="middle">issues · lots · lessons</text></g>
  <!-- title -->
  <text x="48" y="78" fill="#f8fafc" font-size="40" font-weight="700">Climb fast. Fall short.</text>
  <text x="48" y="114" fill="#94a3b8" font-size="19">Agents write the code. The rope is intent, tests, review and CI:</text>
  <text x="48" y="140" fill="#94a3b8" font-size="19">a slip costs one anchor, not the whole route.</text>
</svg>
