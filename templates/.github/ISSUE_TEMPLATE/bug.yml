name: Bug
description: Something does not work as expected
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 'First thing a human reads: a user story ("As a …, I want …, so that …") or two lines.'
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Observed and expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: They become the first (red) test of the fix (METHODOLOGY.md §2 ter).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, commit, device
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Triage sets the matching `priority:` label.
      options: [critical (data loss or crash), high, medium, low]
    validations:
      required: true
