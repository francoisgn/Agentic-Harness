name: Fonctionnalité
description: Une capacité nouvelle ou une amélioration
labels: [feature]
body:
  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: "User story : « En tant que <qui>, je veux que <X> fasse <Y>, pour <bénéfice> » (METHODOLOGY.md §2 bis)."
    validations:
      required: true
  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Le problème à résoudre, pas encore la solution.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Proposition et critères d'acceptation
      description: "Étant donné … / Quand … / Alors … : un critère = un test, écrit avant le code."
    validations:
      required: true
  - type: textarea
    id: erreurs
    attributes:
      label: Comportements d'erreur
      description: "Entrée invalide, panne externe, limite → résultat attendu (message, état conservé). « Aucun » se justifie."
    validations:
      required: true
  - type: textarea
    id: fini
    attributes:
      label: Définition de fini
      description: "Tests verts (vus rouges d'abord), docs à jour, revue par un autre modèle, conformité si concernée, validation sur l'appareil."
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Règle, documentation officielle, comportement de référence (lien ou fichier:ligne). Rien de deviné.
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité
      options: ["P1 🔴", "P2 🟠", "P3 🟢"]
    validations:
      required: true
