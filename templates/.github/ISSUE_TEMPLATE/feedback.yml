# Retour de test : devient une issue par point, rattachée à une issue parapluie (cadre : METHODOLOGY.md §3).
name: Retour de test
description: Bug, ergonomie, calcul ou idée relevé en utilisant l'app
labels: [feedback]
body:
  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Une phrase lisible d'un coup d'œil ; le détail va dans les champs suivants.
      placeholder: "En tant que …, je veux …, pour …"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Bug, Ergonomie / design, Calcul à vérifier, Idée / fonctionnalité, Autre]
    validations:
      required: true
  - type: textarea
    id: constat
    attributes:
      label: Ce que je vois
      description: Saisies utilisées, écran, captures d'écran (glisser-déposer). Jamais de mot de passe, cookie ou donnée personnelle.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que j'attendais
  - type: input
    id: version
    attributes:
      label: Version et appareil
      placeholder: "ex. 0.6.0 (3), iPhone, iOS 27.1"
