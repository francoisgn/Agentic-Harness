# Test feedback: becomes one issue per point, attached to an umbrella issue (harness: METHODOLOGY.md §3).
name: Test feedback
description: Bug, usability, calculation or idea noted while using the app
labels: ["type: epic", "status: needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence readable at a glance; the detail goes in the next fields.
      placeholder: "As a …, I want …, so that …"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Bug, Usability / design, Calculation to verify, Idea / feature, Other]
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What I see
      description: Inputs used, screen, screenshots (drag and drop). Never a password, cookie or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
  - type: input
    id: version
    attributes:
      label: Version and device
      placeholder: "e.g. 0.6.0 (3), iPhone, iOS 27.1"
