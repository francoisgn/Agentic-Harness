name: Tâche ou lot
description: Travail planifié (lot, outillage, docs, CI, release)
body:
  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Deux lignes de synthèse lisibles d'un coup d'œil.
    validations:
      required: true
  - type: input
    id: lot
    attributes:
      label: Lot
      placeholder: "LOT-012 (si c'en est un : spec dans docs/lots/)"
  - type: textarea
    id: perimetre
    attributes:
      label: Périmètre et critères d'acceptation
      description: Ce qui est dedans, ce qui est dehors, comment on saura que c'est fini.
    validations:
      required: true
  - type: textarea
    id: dependances
    attributes:
      label: Dépend de
      description: "Issues ou lots préalables (#n), captures, décisions. Vide si rien."
