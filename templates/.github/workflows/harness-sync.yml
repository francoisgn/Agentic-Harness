name: Harness sync

# Every week (or by hand), looks at the latest vX.Y.Z tag of the Belayline harness; if it is newer than
# .harness/VERSION, runs harness-sync.sh at that tag and opens a DRAFT PR to the integration branch
# (docs/ADOPTION.md §Updates). Nothing else: review and merge stay human.
#
# Access (docs/adr/0001):
#   - public harness: nothing to do; private harness: secret HARNESS_TOKEN = fine-grained token "Contents: read" on
#     francoisgn/belayline-agentic-harness, plus "Contents / Pull requests: write" on THIS repository;
#   - the GITHUB_TOKEN cannot push a file under .github/workflows/: without the variable HARNESS_SYNC_WORKFLOWS=true
#     (and a HARNESS_TOKEN that has "Workflows: write"), the sync skips them and the PR says so;
#   - Settings → Actions → General: "Allow GitHub Actions to create and approve pull requests" (if GITHUB_TOKEN).
# A PR opened with the GITHUB_TOKEN does not trigger the CI: it starts on the switch to "Ready for review".
on:
  schedule:
    - cron: "23 4 * * 1"   # Monday morning, off-peak
  workflow_dispatch:
    inputs:
      ref:
        description: Harness tag to apply (empty = latest tag)
        required: false
        type: string

permissions: {}

concurrency:
  group: harness-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Propose the harness update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      HARNESS_REPO: francoisgn/belayline-agentic-harness
      TOKEN: ${{ secrets.HARNESS_TOKEN || github.token }}
      SYNC_WORKFLOWS: ${{ vars.HARNESS_SYNC_WORKFLOWS }}
      INPUT_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Target version
        id: target
        run: |
          set -euo pipefail
          CURRENT=$(head -1 .harness/VERSION 2>/dev/null || echo "0.0.0")
          AUTH_URL="https://x-access-token:${TOKEN}@github.com/${HARNESS_REPO}.git"
          if [ -n "$INPUT_REF" ]; then TAG="$INPUT_REF"; else
            TAG=$(git ls-remote --tags --refs "$AUTH_URL" 'v*' | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$TAG" ] || { echo "::error::No readable vX.Y.Z tag on $HARNESS_REPO (private repository without HARNESS_TOKEN?)"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "v$CURRENT" = "$TAG" ]; then
            echo "::notice::Harness up to date ($TAG)."; echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "Harness: v$CURRENT → $TAG"; echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        if: steps.target.outputs.todo == 'true'
        id: sync
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -uo pipefail
          git clone --quiet --depth 1 --branch "$TAG" "https://x-access-token:${TOKEN}@github.com/${HARNESS_REPO}.git" "$RUNNER_TEMP/harness"
          FLAGS=(--source "$RUNNER_TEMP/harness" --target . --skip-seed)
          [ "$SYNC_WORKFLOWS" = "true" ] || FLAGS+=(--skip-workflows)
          "$RUNNER_TEMP/harness/scripts/harness-sync.sh" "${FLAGS[@]}" | tee "$RUNNER_TEMP/sync.log"
          STATUS=${PIPESTATUS[0]}
          [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 3 ] || exit "$STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open the draft PR
        if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          STATUS: ${{ steps.sync.outputs.status }}
          GH_TOKEN: ${{ env.TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE=$(jq -r '.integration_branch // empty' .harness/config.json 2>/dev/null || true)
          BASE=${BASE:-$DEFAULT_BRANCH}
          BRANCH="harness/sync-$TAG"
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH" >/dev/null; then
            echo "::notice::$BRANCH already exists: the PR is probably open."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -q -m "Belayline: update to $TAG"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "Update of the [Belayline](https://github.com/${HARNESS_REPO}) harness to \`$TAG\`: see the harness CHANGELOG for details."
            echo
            if [ "$STATUS" = 3 ]; then echo "🟠 **Conflicts**: harness files modified locally were left as they are (log below)."; echo; fi
            if [ "$SYNC_WORKFLOWS" != "true" ]; then echo "🟠 Files under \`.github/workflows/\` not touched: update the \`@$TAG\` references of \`harness.yml\` by hand."; echo; fi
            echo '```'; sed 's/`//g' "$RUNNER_TEMP/sync.log"; echo '```'
            echo
            echo "## Changelog"
            echo "None (tooling)."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base "$BASE" --head "$BRANCH" --title "Belayline: update to $TAG" --body-file "$RUNNER_TEMP/body.md"
