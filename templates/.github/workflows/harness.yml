name: Harness

# Calls the reusable workflows of the Belayline harness (docs/ADOPTION.md). Project file: adapt it
# freely; harness-sync.sh only rewrites the `@…` references below (refbump mode), pinned to the SHA of the
# harness commit with the tag as a comment (`@<sha> # vX.Y.Z`), like any action.
# Budget: Linux jobs of a few seconds (1 min billed each); nothing on macOS.
# `issues` events only trigger the copy of this file present on the repository's default branch.
on:
  push:
    branches: [develop]   # ← the project's default branch
    paths: [.harness/labels.json, .github/labels.local.json, .github/repo-settings.json]
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    # These two strings are repeated verbatim in the conditions of the `flow`, `settings`/`security` and `steward` jobs
    # (github.event.schedule): changing one here without changing it there silently disables the job.
    - cron: "17 5 * * *"   # daily dashboard
    - cron: "47 5 * * 1"   # weekly: settings drift, security (CVE without a commit), doc audit, if those jobs are enabled
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]   # labels: ledger check; closed: doc steward
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: francoisgn/belayline-agentic-harness/.github/workflows/labels-sync.yml@v0.3.0
    with:
      apply-aliases: false   # true to rename old labels (e.g. `P1 🔴` → `priority: high`), once the project's workflows and docs use the new names

  issue:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: francoisgn/belayline-agentic-harness/.github/workflows/issue-hygiene.yml@v0.3.0

  pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: francoisgn/belayline-agentic-harness/.github/workflows/pr-hygiene.yml@v0.3.0
    with:
      # Model A (develop → beta → master). Model B (one integration branch): leave empty.
      flow: "beta:develop beta:hotfix/* master:beta master:hotfix/*"
      # Ledger (CONVENTIONS.md §Ledger): "ledger" if the project keeps one, otherwise empty. The `### Ledger` section
      # is the entry; this label is never asked of the author (the steward writes `ledger: done`).
      ledger-label: ""
      # Integration branch of .harness/config.json: warns if it is not the default branch (needs a harness version
      # that has this input; uncomment after the next version bump).
      # integration-branch: "develop"

  # Repository settings "as code" (.github/repo-settings.json): applied on push, drift checked on Monday.
  # Secret REPO_ADMIN_TOKEN (fine-grained, this repository only, "Administration: write"); missing → warning only.
  settings:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1')
    permissions:
      contents: read
    uses: francoisgn/belayline-agentic-harness/.github/workflows/repo-settings.yml@v0.3.0
    with:
      apply: ${{ github.event_name != 'schedule' }}
    secrets:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

  # Flow dashboard (FINOPS.md §4): a "Project dashboard" issue updated every day.
  flow:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: francoisgn/belayline-agentic-harness/.github/workflows/flow-report.yml@v0.3.0

  # Docs + security baseline, if the project does not have it already (otherwise delete these jobs: do not pay twice).
  # docs:
  #   if: github.event_name == 'pull_request' && !contains(fromJSON('["edited", "labeled", "unlabeled", "closed"]'), github.event.action)
  #   permissions:
  #     contents: read
