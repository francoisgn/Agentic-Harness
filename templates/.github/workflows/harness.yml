name: Cadre

# Appelle les workflows réutilisables du cadre agentic-harness (docs/ADOPTION.md). Fichier du projet : l'adapter
# librement ; harness-sync.sh ne réécrit que les références `@…` ci-dessous (mode refbump), épinglées au SHA du
# commit du cadre avec le tag en commentaire (`@<sha> # vX.Y.Z`), comme toute action.
# Budget : jobs Linux de quelques secondes (1 min facturée chacun) ; rien de macOS.
# Les événements `issues` ne déclenchent que la copie de ce fichier présente sur la branche par défaut du dépôt.
on:
  push:
    branches: [develop]   # ← branche par défaut du projet
    paths: [.harness/labels.json, .github/labels.local.json, .github/repo-settings.json]
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    - cron: "17 5 * * *"   # tableau de bord quotidien
    - cron: "47 5 * * 1"   # hebdomadaire : dérive des réglages, sécurité (CVE sans commit) si le job security est activé
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: francoisgn/agentic-harness/.github/workflows/labels-sync.yml@v0.2.0
    with:
      apply-aliases: false   # true pour renommer d'anciens labels (ex. `priority: high` → `P1 🔴`)

  issue:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: francoisgn/agentic-harness/.github/workflows/issue-hygiene.yml@v0.2.0

  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: francoisgn/agentic-harness/.github/workflows/pr-hygiene.yml@v0.2.0
    with:
      # Modèle A (develop → beta → master). Modèle B (une branche d'intégration) : laisser vide.
      flow: "beta:develop beta:hotfix/* master:beta master:hotfix/*"
      require-changelog: true

  # Réglages du dépôt « as code » (.github/repo-settings.json) : appliqués au push, dérive contrôlée le lundi.
  # Secret REPO_ADMIN_TOKEN (fine-grained, ce dépôt seul, « Administration: write ») ; absent → avertissement seulement.
  settings:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1')
    permissions:
      contents: read
    uses: francoisgn/agentic-harness/.github/workflows/repo-settings.yml@v0.2.0
    with:
      apply: ${{ github.event_name != 'schedule' }}
    secrets:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

  # Tableau de bord du flux (FINOPS.md §4) : une issue « Tableau de bord du projet » mise à jour chaque jour.
  flow:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: francoisgn/agentic-harness/.github/workflows/flow-report.yml@v0.2.0

  # Socle docs + sécurité, si le projet ne l'a pas déjà (sinon supprimer ces jobs : on ne paie pas deux fois).
  # docs:
  #   if: github.event_name == 'pull_request' && github.event.action != 'edited'
  #   permissions:
  #     contents: read
  #   uses: francoisgn/agentic-harness/.github/workflows/docs-security.yml@v0.2.0
  #   with:
  #     gitleaks: false   # déjà dans le job security
  # security:   # SAST (Semgrep) + SCA (Trivy) + secrets (gitleaks), CI-BUDGET.md §3
  #   if: (github.event_name == 'pull_request' && github.event.action != 'edited') || (github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1')
  #   permissions:
  #     contents: read
  #   uses: francoisgn/agentic-harness/.github/workflows/security.yml@v0.2.0
  #   with:
  #     semgrep-configs: "p/default p/secrets p/github-actions"   # + p/swift, p/python…

