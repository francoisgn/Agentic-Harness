  # Doc steward (STEWARDS.md §2; needs a harness version that has doc-steward.yml): after each merge into the
  # integration branch, ONE draft docs PR (branch docs/steward) that folds the ledger and updates the files the merged
  # PRs' `Docs:` lines name; nothing to fold → one short job, no agent. Monday: audit only (README, links, diagrams,
  # progress block), one issue per gap. Merge pass: secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN, skipped with
  # a notice without it; the audit needs none. Never required. Settings → Actions → General: "Allow GitHub Actions to
